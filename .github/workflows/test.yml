name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install --quiet pillow==12.3.0
      - run: python -m unittest discover -s tests

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./
        with:
          theme: reef
          dark-theme: night
          name: "Test koi"
          creatures: all
          evolution: true
          streak-rewards: true
          sign: true
      - run: test -s aquarium.gif && test -s aquarium-dark.gif
